<style>
:root{--ink:#1c1b3a;--v:#5b3df5;--y:#ffc93c;--bg:#f6f4ff;--ok:#12a150;--ko:#e5484d;--m:#5f5e7a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.top{background:var(--v);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;color:#fff;font-size:20px;font-weight:900;letter-spacing:1px;padding:4px 0;min-height:44px}
.badge{position:relative;width:38px;height:38px;border-radius:12px;background:#fff;color:var(--v);border:2px solid var(--ink);display:grid;place-items:center;font-size:24px;font-weight:900;line-height:1}
.badge::after{content:"";position:absolute;right:-5px;bottom:-5px;width:12px;height:12px;border-radius:50%;background:var(--y);border:2px solid var(--ink)}
main{max-width:560px;margin:0 auto;padding:16px 16px 110px}
h1,h2,h3{line-height:1.2;margin:0}
h2{font-size:22px;margin:8px 0 12px}
h3{font-size:17px;margin:14px 0 4px}
p{margin:6px 0}
.muted{color:var(--m);font-size:14px}
.card,.cat,.opt,.fb{background:#fff;border:2px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink)}
.card{padding:4px 16px 14px;margin-bottom:14px}
.hero{text-align:center;padding:4px 0 8px}
.hero .badge{width:76px;height:76px;border-radius:24px;font-size:48px;margin:0 auto 14px;box-shadow:0 5px 0 var(--ink)}
.hero .badge::after{width:24px;height:24px;right:-8px;bottom:-8px}
.hero h1{font-size:36px;font-weight:900;letter-spacing:2px}
.slogan{font-size:19px;font-weight:700;color:var(--v);margin-top:6px}
.cat{display:flex;align-items:center;gap:14px;width:100%;min-height:80px;padding:12px 14px;margin:0 0 16px;text-align:left}
.cat:active,.opt:active:not(:disabled),.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.ico{flex:none;width:52px;height:52px;border-radius:14px;border:2px solid var(--ink);background:var(--k);display:grid;place-items:center;font-size:28px}
.txt{flex:1}.txt b{display:block;font-size:17px}.txt small{color:var(--m);font-size:14px}
.go{font-size:28px;font-weight:900}
.btn{display:block;width:100%;min-height:56px;margin-top:16px;border:2px solid var(--ink);border-radius:16px;background:var(--v);color:#fff;font-size:18px;font-weight:800;box-shadow:0 4px 0 var(--ink)}
.btn.sec{background:#fff;color:var(--ink)}
#suiv{scroll-margin-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}
.lien{background:none;border:0;min-height:44px;padding:0 4px;font-weight:700;color:var(--m)}
.prog{height:12px;border:2px solid var(--ink);border-radius:8px;background:#fff;overflow:hidden}
.prog i{display:block;height:100%;background:var(--y);transition:width .3s}
.num{margin:10px 0 0;font-size:14px;color:var(--m);font-weight:700}
.q{font-size:22px;margin:8px 0 14px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:10px 14px;margin:0 0 12px;text-align:left;font-size:17px}
.opt b{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-size:15px;background:var(--bg)}
.opt:disabled{cursor:default;color:var(--ink)}
.opt.ok{background:#dcf5e6;border-color:var(--ok)}.opt.ok b{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.ko{background:#fde4e4;border-color:var(--ko)}.opt.ko b{background:var(--ko);color:#fff;border-color:var(--ko)}
.fb{padding:12px 16px;margin-top:4px}
.fb.ok{border-left:10px solid var(--ok)}.fb.ko{border-left:10px solid var(--ko)}
.fb h3{margin-top:0}
.res{text-align:center}
.cercle{width:160px;height:160px;border-radius:50%;margin:14px auto;border:2px solid var(--ink);background:conic-gradient(var(--v) calc(var(--pc)*1%),#fff 0);display:grid;place-items:center}
.cercle span{width:118px;height:118px;border-radius:50%;background:#fff;border:2px solid var(--ink);display:grid;place-items:center;font-size:34px;font-weight:900}
.rec{display:inline-block;background:var(--y);border:2px solid var(--ink);border-radius:12px;padding:4px 12px;font-weight:800}
.score{display:flex;align-items:center;gap:12px;padding:12px 16px}
.score .ico{width:44px;height:44px;font-size:22px}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:2px solid var(--ink);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{background:none;border:0;min-height:62px;font-size:22px;line-height:1.1;padding:6px 2px}
nav span{display:block;font-size:12px;font-weight:700;color:var(--m)}
nav button.on span{color:var(--v)}
nav button.on{box-shadow:inset 0 4px 0 var(--v)}
.pub[hidden]{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const N=10,KEY="quizora_scores_v1";
const $=s=>document.querySelector(s),app=$("#app");
let etat=null;
const melange=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const lire=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}};
const ecrire=o=>{try{localStorage.setItem(KEY,JSON.stringify(o));return true}catch(e){return false}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function accueil(){const sc=lire();
app.innerHTML=`<section class="hero"><div class="badge">Q</div><h1>QUIZORA</h1><p class="slogan">Apprends, joue et progresse !</p></section>
<h2>Choisis une catégorie</h2>`+CATS.map(c=>`<button class="cat" data-c="${c.id}"><span class="ico" style="--k:${c.k}">${c.ico}</span><span class="txt"><b>${c.nom}</b><small>${N} questions par partie${sc[c.id]?", meilleur score : "+sc[c.id].pct+" %":""}</small></span><span class="go">›</span></button>`).join("");
app.querySelectorAll(".cat").forEach(b=>b.onclick=()=>demarrer(b.dataset.c))}

function demarrer(id){const c=CATS.find(x=>x.id===id);if(etatNav()!=="quiz")pousser("quiz");
etat={c,qs:melange(c.q).slice(0,N).map(a=>({t:a[0],b:a[1],o:melange(a.slice(1,5)),e:a[5]})),i:0,s:0,rep:false};
question()}

function question(){const{c,qs,i}=etat,q=qs[i];etat.rep=false;
app.innerHTML=`<div class="qhead"><button class="lien" id="quit">✕ Quitter</button><span>${c.nom}</span></div>
<div class="prog"><i style="width:${i/qs.length*100}%"></i></div>
<p class="num">Question ${i+1} sur ${qs.length} – Score : ${etat.s}</p>
<h2 class="q">${esc(q.t)}</h2>`+q.o.map((o,k)=>`<button class="opt" data-k="${k}"><b>${"ABCD"[k]}</b><span>${esc(o)}</span></button>`).join("")+`<div id="fb"></div>`;
$("#quit").onclick=()=>{if(confirm("Quitter ce quiz ? Ta progression sera perdue."))aller("accueil")};
app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>repondre(+b.dataset.k));window.scrollTo(0,0)}

function repondre(k){if(etat.rep)return;etat.rep=true;
const q=etat.qs[etat.i],ok=q.o[k]===q.b,der=etat.i===etat.qs.length-1;
if(ok)etat.s++;
app.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(q.o[j]===q.b)b.classList.add("ok");else if(j===k)b.classList.add("ko")});
$("#fb").innerHTML=`<div class="fb ${ok?"ok":"ko"}" role="status"><h3>${ok?"✅ Bonne réponse !":"❌ Mauvaise réponse"}</h3>${ok?"":`<p>Bonne réponse : <b>${esc(q.b)}</b></p>`}<p>💡 ${esc(q.e)}</p></div><button class="btn" id="suiv">${der?"Voir mon résultat":"Question suivante"}</button>`;
$("#suiv").onclick=()=>{etat.i++;der?resultat():question()};
$("#suiv").scrollIntoView({block:"nearest"})}

function resultat(){const{c,qs,s}=etat,pct=Math.round(s/qs.length*100),sc=lire(),prev=sc[c.id],record=!prev||pct>prev.pct;
let saved=true;
if(record){sc[c.id]={pct,score:s,total:qs.length,date:new Date().toLocaleDateString("fr-FR")};saved=ecrire(sc)}
const msg=pct>=80?"Excellent travail ! 🎉":pct>=50?"Bien joué, continue ! 👍":"Rejoue pour progresser, tu vas y arriver ! 💪";
app.innerHTML=`<section class="res"><p class="muted">${esc(c.nom)}</p><div class="cercle" style="--pc:${pct}"><span>${pct} %</span></div><h2>${s} sur ${qs.length} bonnes réponses</h2><p>${msg}</p>${record?`<p class="rec">🏆 Nouveau meilleur score !</p>`:`<p class="muted">Meilleur score : ${prev.pct} %</p>`}${saved?"":`<p class="muted">⚠️ Score non enregistré : le stockage du navigateur est indisponible (navigation privée ?).</p>`}</section>
<button class="btn" id="rej">🔄 Recommencer</button><button class="btn sec" id="acc">Changer de catégorie</button>`;
$("#rej").onclick=()=>demarrer(c.id);$("#acc").onclick=()=>aller("accueil");window.scrollTo(0,0)}

function scores(){const sc=lire();
app.innerHTML=`<h2>🏆 Meilleurs scores</h2>`+CATS.map(c=>{const r=sc[c.id];return `<div class="card score"><span class="ico" style="--k:${c.k}">${c.ico}</span><div><b>${c.nom}</b><br>${r?`${r.pct} % (${r.score} sur ${r.total}), le ${r.date}`:`<span class="muted">Pas encore joué</span>`}</div></div>`}).join("")+`<button class="btn sec" id="raz">Effacer mes scores</button><p class="muted">Les scores sont enregistrés uniquement sur cet appareil, dans ce navigateur.</p>`;
$("#raz").onclick=()=>{if(confirm("Effacer tous les meilleurs scores ?")){try{localStorage.removeItem(KEY)}catch(e){}scores()}}}

function apropos(){const n=CATS.reduce((t,c)=>t+c.q.length,0);
app.innerHTML=`<h2>À propos</h2><div class="card"><h3>Quizora</h3><p>Quizora est une application de quiz éducatifs en français. Son slogan : <i>Apprends, joue et progresse !</i></p><h3>Contenu</h3><p>4 catégories (culture générale, français, marketing et gestion commerciale, sciences et technologies) et ${n} questions originales. Chaque réponse est suivie d'une explication.</p><h3>Utilisation</h3><p>Gratuite, sans compte, directement dans le navigateur.</p><p class="muted">Version 1.0. Les explications sont données à titre pédagogique : en cas de doute, vérifie dans tes cours.</p></div>`}

function confidentialite(){
app.innerHTML=`<h2>Confidentialité</h2><div class="card"><h3>Aucune donnée personnelle</h3><p>Quizora ne demande ni nom, ni e-mail, ni compte, et n'envoie aucune donnée à un serveur.</p><h3>Stockage sur ton appareil</h3><p>Seuls tes meilleurs scores sont enregistrés, dans le stockage local de ton navigateur. Tu peux les effacer depuis la page Scores ou en vidant les données du site.</p><h3>Pas de suivi</h3><p>L'application n'utilise ni cookie de suivi, ni outil d'analyse, ni service tiers.</p><h3>Hébergement</h3><p>Le service qui héberge le site peut conserver des journaux techniques standards (par exemple l'adresse IP), indépendamment de l'application.</p><h3>Publicité</h3><p>Aucune publicité n'est affichée actuellement. Si cela change, cette page sera mise à jour avant.</p></div>`}

const vues={accueil,scores,apropos,confidentialite};
const etatNav=()=>{try{return history.state&&history.state.v}catch(e){return null}};
const pousser=v=>{try{history.pushState({v},"")}catch(e){}};
function aller(v,push=true){if(push&&etatNav()!==v)pousser(v);document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));vues[v]();window.scrollTo(0,0)}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>aller(b.dataset.v));
$("#home").onclick=()=>aller("accueil");
window.addEventListener("popstate",e=>aller(e.state&&vues[e.state.v]?e.state.v:"accueil",false));
try{history.replaceState({v:"accueil"},"")}catch(e){}
aller("accueil",false);
</script>
</body>
</html>
